<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basata | English Learning Platform</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial,"Tahoma",sans-serif;
      min-height:100vh;
      background:linear-gradient(135deg,#eef6ff,#ffffff 55%,#f1f8ff);
      color:#17324d;
    }
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{
      width:min(920px,100%);
      background:#fff;
      border-radius:28px;
      box-shadow:0 18px 60px rgba(22,65,110,.14);
      overflow:hidden;
      border:1px solid #e5eef7;
    }
    .hero{
      padding:42px 28px 30px;
      text-align:center;
      background:linear-gradient(135deg,#0d6efd,#1554a5);
      color:#fff;
    }
    .logo{
      width:76px;height:76px;margin:0 auto 16px;
      border-radius:22px;background:#fff;color:#0d6efd;
      display:flex;align-items:center;justify-content:center;
      font-size:42px;font-weight:800;
      box-shadow:0 10px 30px rgba(0,0,0,.15);
    }
    .hero h1{font-size:34px;margin-bottom:10px}
    .hero p{font-size:17px;opacity:.94}
    .content{padding:32px}
    .screen{display:none}
    .screen.active{display:block}
    .intro{text-align:center}
    .intro h2{font-size:28px;margin-bottom:12px}
    .intro p{color:#65798c;line-height:1.8;margin-bottom:26px}
    .buttons{display:grid;gap:14px;max-width:500px;margin:auto}
    button{
      border:0;border-radius:14px;padding:15px 18px;
      font-size:16px;font-weight:700;cursor:pointer;
      transition:.2s; font-family:inherit;
    }
    button:hover{transform:translateY(-1px)}
    .primary{background:#0d6efd;color:#fff}
    .secondary{background:#edf5ff;color:#0d5fbd}
    .back{background:#f3f5f7;color:#526474}
    .form-title{text-align:center;font-size:26px;margin-bottom:22px}
    .grid{
      display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
    }
    .field{display:flex;flex-direction:column;gap:7px}
    .field.full{grid-column:1/-1}
    label{font-weight:700;font-size:14px;color:#304b63}
    input,select{
      width:100%;padding:13px 14px;border:1px solid #d7e2ec;
      border-radius:12px;outline:none;font-size:15px;
      background:#fbfdff;font-family:inherit;
    }
    input:focus,select:focus{border-color:#0d6efd;box-shadow:0 0 0 3px rgba(13,110,253,.1)}
    .actions{display:grid;gap:10px;margin-top:20px}
    .message{
      margin-top:14px;padding:12px;border-radius:10px;
      background:#f1f7ff;color:#24547c;text-align:center;display:none;
    }
    .footer{text-align:center;color:#8a99a8;font-size:13px;margin-top:22px}
    @media(max-width:650px){
      .wrap{padding:12px}
      .content{padding:22px 16px}
      .hero{padding:32px 18px 24px}
      .hero h1{font-size:28px}
      .grid{grid-template-columns:1fr}
      .field.full{grid-column:auto}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <section class="hero">
        <div class="logo">B</div>
        <h1>Basata</h1>
        <p>English made simple. 🇬🇧</p>
      </section>

      <section class="content">
        <div id="home" class="screen active">
          <div class="intro">
            <h2>ابدأ رحلتك في تعلم الإنجليزية 🇬🇧</h2>
            <p>منصة Basata التعليمية لتعلم اللغة الإنجليزية بطريقة بسيطة ومنظمة.</p>
            <div class="buttons">
              <button class="primary" onclick="showScreen('signup')">إنشاء حساب جديد</button>
              <button class="secondary" onclick="showScreen('login')">لدي حساب بالفعل — تسجيل الدخول</button>
            </div>
          </div>
        </div>

        <div id="signup" class="screen">
          <h2 class="form-title">إنشاء حساب جديد</h2>
          <form id="signupForm">
            <div class="grid">
              <div class="field">
                <label>الاسم الأول</label>
                <input required type="text" placeholder="اكتب الاسم الأول">
              </div>
              <div class="field">
                <label>الاسم الثاني</label>
                <input required type="text" placeholder="اكتب الاسم الثاني">
              </div>
              <div class="field">
                <label>الاسم الثالث</label>
                <input type="text" placeholder="اكتب الاسم الثالث">
              </div>
              <div class="field">
                <label>اسم العائلة</label>
                <input required type="text" placeholder="اكتب اسم العائلة">
              </div>
              <div class="field">
                <label>رقم الهاتف</label>
                <input required type="tel" placeholder="01xxxxxxxxx">
              </div>
              <div class="field">
                <label>الصف الدراسي</label>
                <select required>
                  <option value="">اختر الصف</option>
                  <option>الصف الأول الإعدادي</option>
                  <option>الصف الثاني الإعدادي</option>
                  <option>الصف الثالث الإعدادي</option>
                  <option>الصف الأول الثانوي</option>
                  <option>الصف الثاني الثانوي</option>
                  <option>الصف الثالث الثانوي</option>
                </select>
              </div>
              <div class="field">
                <label>رقم الطالب</label>
                <input required type="text" placeholder="رقم الطالب">
              </div>
              <div class="field">
                <label>كلمة المرور</label>
                <input required type="password" placeholder="كلمة المرور">
              </div>
              <div class="field full">
                <label>تأكيد كلمة المرور</label>
                <input required type="password" placeholder="أعد كتابة كلمة المرور">
              </div>
            </div>
            <div class="actions">
              <button class="primary" type="submit">إنشاء الحساب</button>
              <button class="back" type="button" onclick="showScreen('home')">العودة</button>
            </div>
            <div id="signupMessage" class="message"></div>
          </form>
        </div>

        <div id="login" class="screen">
          <h2 class="form-title">تسجيل الدخول</h2>
          <form id="loginForm">
            <div class="grid">
              <div class="field full">
                <label>رقم الهاتف</label>
                <input required type="tel" placeholder="01xxxxxxxxx">
              </div>
              <div class="field full">
                <label>كلمة المرور</label>
                <input required type="password" placeholder="كلمة المرور">
              </div>
            </div>
            <div class="actions">
              <button class="primary" type="submit">تسجيل الدخول</button>
              <button class="secondary" type="button" onclick="showScreen('signup')">إنشاء حساب جديد</button>
              <button class="back" type="button" onclick="showScreen('home')">العودة</button>
            </div>
            <div id="loginMessage" class="message"></div>
          </form>
        </div>

        <div class="footer">Basata — English Learning Platform</div>
      </section>
    </main>
  </div>

  <script>
    function showScreen(id){
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo({top:0,behavior:'smooth'});
    }

    document.getElementById('signupForm').addEventListener('submit', function(e){
      e.preventDefault();
      const msg=document.getElementById('signupMessage');
      msg.textContent='تم استلام بيانات التسجيل بنجاح ✅ سنربط الحساب بقاعدة البيانات في الخطوة التالية.';
      msg.style.display='block';
    });

    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const msg=document.getElementById('loginMessage');
      msg.textContent='تم إرسال طلب تسجيل الدخول ✅ سنربطه بقاعدة البيانات في الخطوة التالية.';
      msg.style.display='block';
    });
  </script>
</body>
</html>
